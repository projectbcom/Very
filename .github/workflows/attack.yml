name: bdd-predicate with 5-bit bias

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python (for converter only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements (converter only)
        run: pip install -r requirements.txt

      - name: Convert signatures to bdd-predicate format
        run: python convert.py

      - name: Pull official bdd-predicate Docker image
        run: docker pull malb/bdd-predicate:latest

      - name: Attack with Sieve (scale + parallel)
        run: |
          docker run --rm -v $PWD:/data malb/bdd-predicate:latest \
            sage -python /bdd-predicate/ecdsa_cli.py solve -c secp256k1 -f scale -p 8 /data/input.txt
        continue-on-error: true

      - name: Attack with Enumeration (fallback)
        if: always()
        run: |
          docker run --rm -v $PWD:/data malb/bdd-predicate:latest \
            sage -python /bdd-predicate/ecdsa_cli.py solve -c secp256k1 --algorithm enum_pred /data/input.txt
        continue-on-error: true

      - name: Attack with BKZ (final fallback)
        if: always()
        run: |
          docker run --rm -v $PWD:/data malb/bdd-predicate:latest \
            sage -python /bdd-predicate/ecdsa_cli.py solve -c secp256k1 --algorithm bkz_pred /data/input.txt
        continue-on-error: true
