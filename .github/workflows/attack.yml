name: Lattice Attack (5-bit MSB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libfplll-dev

      - name: Install Python packages
        run: pip install fpylll gmpy2 ecdsa

      - name: Run lattice attack
        run: python attack.py
