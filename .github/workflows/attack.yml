name: bdd-predicate with 5-bit bias

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python (for converter only)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements (converter only)
        run: pip install -r requirements.txt

      - name: Convert signatures to bdd-predicate format
        run: python convert.py

      - name: Install Miniconda and SageMath
        run: |
          wget -q https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-x86_64.sh -O miniconda.sh
          bash miniconda.sh -b -p $HOME/miniconda
          echo "$HOME/miniconda/bin" >> $GITHUB_PATH
          source $HOME/miniconda/etc/profile.d/conda.sh
          conda init bash
          conda install -c conda-forge sage -y

      - name: Clone bdd-predicate (without submodules)
        run: git clone https://github.com/malb/bdd-predicate.git

      - name: Override submodule URL and update
        run: |
          cd bdd-predicate
          # Set the URL for the g6k submodule using the token
          git config --local submodule.g6k.url https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/malb/g6k.git
          # Sync the new URL
          git submodule sync
          # Initialize and update recursively
          git submodule update --init --recursive
          # Verify g6k exists
          ls -la g6k/

      - name: Install g6k and fpylll
        run: |
          source $HOME/miniconda/etc/profile.d/conda.sh
          conda activate base
          pip install fpylll
          cd bdd-predicate/g6k
          pip install -e .
          cd ../..
          cd bdd-predicate
          pip install -r requirements.txt

      - name: Attack with Sieve (scale + parallel)
        run: |
          source $HOME/miniconda/etc/profile.d/conda.sh
          conda activate base
          cd bdd-predicate
          export PYTHONPATH="$PWD:$PYTHONPATH"
          python ecdsa_cli.py solve -c secp256k1 -f scale -p 8 ../input.txt
        continue-on-error: true

      - name: Attack with Enumeration (fallback)
        if: always()
        run: |
          source $HOME/miniconda/etc/profile.d/conda.sh
          conda activate base
          cd bdd-predicate
          export PYTHONPATH="$PWD:$PYTHONPATH"
          python ecdsa_cli.py solve -c secp256k1 --algorithm enum_pred ../input.txt
        continue-on-error: true

      - name: Attack with BKZ (final fallback)
        if: always()
        run: |
          source $HOME/miniconda/etc/profile.d/conda.sh
          conda activate base
          cd bdd-predicate
          export PYTHONPATH="$PWD:$PYTHONPATH"
          python ecdsa_cli.py solve -c secp256k1 --algorithm bkz_pred ../input.txt
        continue-on-error: true
