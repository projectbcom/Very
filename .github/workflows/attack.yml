      - name: Clone official bdd-predicate repository WITH submodules
        run: |
          git clone --recursive https://github.com/malb/bdd-predicate.git
          cd bdd-predicate
          git submodule update --init --recursive

      - name: Install bdd-predicate dependencies and build g6k
        run: |
          source $HOME/miniconda/etc/profile.d/conda.sh
          conda activate base
          cd bdd-predicate
          pip install -r requirements.txt
          # Build/install the g6k submodule locally
          cd g6k
          pip install -e .
