name: bdd-predicate with 5-bit bias

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04   # More disk space
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Convert signatures to bdd-predicate format
        run: python convert.py

      - name: Clone bdd-predicate official repository
        run: git clone https://github.com/malb/bdd-predicate.git

      - name: Initialize submodules
        run: |
          cd bdd-predicate
          git submodule update --init --recursive

      - name: Build Docker image from official Dockerfile
        run: |
          cd bdd-predicate
          docker build -t bdd-predicate .

      - name: Attack with Sieve (scale + parallel)
        run: |
          cd bdd-predicate
          docker run --rm -v $PWD/..:/data bdd-predicate \
            sage -python ecdsa_cli.py solve -c secp256k1 -f scale -p 8 /data/input.txt
        continue-on-error: true

      - name: Attack with Enumeration (fallback)
        if: always()
        run: |
          cd bdd-predicate
          docker run --rm -v $PWD/..:/data bdd-predicate \
            sage -python ecdsa_cli.py solve -c secp256k1 --algorithm enum_pred /data/input.txt
        continue-on-error: true

      - name: Attack with BKZ (final fallback)
        if: always()
        run: |
          cd bdd-predicate
          docker run --rm -v $PWD/..:/data bdd-predicate \
            sage -python ecdsa_cli.py solve -c secp256k1 --algorithm bkz_pred /data/input.txt
        continue-on-error: true
