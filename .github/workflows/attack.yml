name: ecdsa-break Attack

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgmp-dev libmpfr-dev libfplll-dev

      - name: Install ecdsa-break and dependencies
        run: |
          pip install --upgrade pip
          pip install ecdsa-break fpylll gmpy2 ecdsa

      - name: Run attack
        run: python attack.py
