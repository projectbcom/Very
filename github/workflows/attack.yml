name: bdd-predicate with 5-bit bias

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install requirements
        run: pip install -r requirements.txt

      - name: Convert signatures to bdd-predicate format
        run: python convert.py

      - name: Attack with Sieve
        run: |
          docker run --rm -v $PWD:/data malb/bdd-predicate \
            sage -python ecdsa_cli.py solve -c secp256k1 -f scale -p 8 /data/input.txt
        continue-on-error: true

      - name: Attack with Enumeration (if sieve fails)
        if: failure()
        run: |
          docker run --rm -v $PWD:/data malb/bdd-predicate \
            sage -python ecdsa_cli.py solve -c secp256k1 --algorithm enum_pred /data/input.txt
        continue-on-error: true

      - name: Attack with BKZ (if enum fails)
        if: failure()
        run: |
          docker run --rm -v $PWD:/data malb/bdd-predicate \
            sage -python ecdsa_cli.py solve -c secp256k1 --algorithm bkz_pred /data/input.txt
        continue-on-error: true
